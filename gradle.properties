# --- JVM ---
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# --- Gradle performance ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- AndroidX ---
android.useAndroidX=true
# Only generate R classes with resources from the module itself (faster builds).
android.nonTransitiveRClass=true

# --- Kotlin ---
kotlin.code.style=official
# Room 2.6.1's compiler is not KSP2-compatible ("unexpected jvm signature V").
# Stay on KSP1 until Room is bumped to 2.7+; KSP 2.3+ removes KSP1 entirely.
ksp.useKSP2=false
