# Static security analysis: CodeQL scans the Kotlin/Java sources for known
# vulnerability patterns on every PR, every push to main, and weekly (to pick
# up newly added queries). Findings land in the repo's Security tab and as PR
# check annotations. build-mode "none" analyzes without compiling, which is
# fast and avoids coupling the scan to the AGP toolchain.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '26 8 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
