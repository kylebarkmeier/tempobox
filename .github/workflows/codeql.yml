# Static security analysis with CodeQL.
#
# Scope today: the "actions" language — scans the workflow files themselves
# for script-injection and permission pitfalls. Kotlin source analysis is NOT
# enabled because CodeQL's Kotlin extractor currently supports only Kotlin
# <= 2.2.x (this repo is on 2.4.x) and build-mode "none" skips Kotlin files
# entirely. Revisit `languages: java-kotlin` (with build-mode autobuild) once
# CodeQL supports the repo's Kotlin version.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '26 8 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:actions'
