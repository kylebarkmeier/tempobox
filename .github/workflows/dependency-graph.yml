# Submits the resolved Gradle dependency graph to GitHub on every push to main.
# This is what makes Dependabot alerts and the dependency-review PR check see
# the project's real (transitive) dependencies instead of only what Dependabot
# can parse out of the build files.
#
# The graph is scoped to runtime classpaths: only dependencies that ship in
# the APK. An unscoped submission also reports the build toolchain (AGP pulls
# Netty, BouncyCastle, jose4j, JDOM, ...), which produced 51 alerts for code
# that never leaves the build machine. Toolchain fixes arrive via AGP/Kotlin
# updates, which Dependabot already PRs from the version catalog.
name: Dependency graph

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph-include-configurations: '.*[rR]untimeClasspath$'
