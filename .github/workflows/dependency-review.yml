# Blocks PRs that introduce dependencies with known vulnerabilities (CVE/GHSA),
# using the dependency graph diff between base and head. The graph itself is
# populated by dependency-graph.yml on pushes to main.
name: Dependency review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
